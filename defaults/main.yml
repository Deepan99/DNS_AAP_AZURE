---
# ==============================================================================
# Enterprise Default Variables for ISC BIND DNS Role
# Path: defaults/main.yml
# ==============================================================================

# Authoritative Zones & ACLs
bind_zones: []
bind_acls: []
bind_dns_keys: []

# Listening Interfaces & Ports
bind_listen_ipv4:
  - "any"
bind_listen_ipv4_port:
  - 53

bind_listen_ipv6:
  - "::1"
bind_listen_ipv6_port:
  - 53

# Security & Query Access (Restricted to Private CIDRs)
bind_allow_query:
  - "localhost"
  - "10.0.0.0/8"

bind_recursion: true
bind_allow_recursion:
  - "localhost"
  - "10.0.0.0/8"

bind_forward_only: false

# Upstream Recursive Resolvers (Azure Internal + Google Fallback)
bind_forwarders:
  - "168.63.129.16"
  - "8.8.8.8"

# Performance & DNSSEC
bind_rrset_order: "random"
bind_dnssec_enable: true
bind_dnssec_validation: true

# Statistics & Logging
bind_statistics_channels: false
bind_statistics_port: 8053
bind_statistics_host: 127.0.0.1
bind_statistics_allow:
  - "127.0.0.1"

# Zone TTL Defaults
bind_zone_ttl: "1W"
bind_zone_time_to_refresh: "1D"
bind_zone_time_to_retry: "1H"
bind_zone_time_to_expire: "1W"
bind_zone_minimum_ttl: "1D"
bind_zone_file_mode: "0640"

bind_python_version: "{{ bind_default_python_version }}"
bind_log: "data/named.run"
