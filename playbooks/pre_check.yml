---
# ==============================================================================
# Playbook: Pre-Deployment Infrastructure & DNS Check
# AAP / AWX Workflow Step 1
# ==============================================================================

- name: Pre-check DNS server prerequisites
  hosts: dns_servers
  become: true
  gather_facts: true
  tasks:
    - name: Confirm supported operating system
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
        fail_msg: This initial bind_dns role supports Ubuntu/Debian only.

    - name: Confirm configured DNS listener is present on the host
      ansible.builtin.assert:
        that: bind_dns_listen_addresses | select('in', ansible_all_ipv4_addresses) | list | length > 0
        fail_msg: The configured bind_dns_listen_addresses value does not belong to this host.

    - name: Inspect existing DNS listeners
      ansible.builtin.command: ss -lntup
      register: pre_port_53
      changed_when: false

- name: Pre-check DNS client prerequisites
  hosts: dns_clients
  become: true
  gather_facts: false
  tasks:
    - name: Inspect current resolver state
      ansible.builtin.command: resolvectl status
      register: pre_spoke_dns
      changed_when: false
      failed_when: false
