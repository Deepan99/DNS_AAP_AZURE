---
# ==============================================================================
# Playbook: Configure DNS Client Resolvers on Spoke Workloads
# Target: Spoke VMs / Client Nodes
# ==============================================================================

- name: Configure DNS resolver on spoke clients
  hosts: dns_clients
  become: true
  gather_facts: true

  tasks:
    - name: Configure systemd-resolved DNS servers
      ansible.builtin.ini_file:
        path: /etc/systemd/resolved.conf
        section: Resolve
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: yes
      loop:
        - { option: "DNS", value: "{{ dns_client_nameservers | join(' ') }}" }
        - { option: "Domains", value: "{{ dns_client_search_domains | join(' ') }}" }
      notify: Restart systemd-resolved

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
