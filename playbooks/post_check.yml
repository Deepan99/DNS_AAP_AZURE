---
# ==============================================================================
# Playbook: Post-Deployment Infrastructure & DNS Validation
# AAP / AWX Workflow Step 4 (Final Validation)
# ==============================================================================

- name: Post-check DNS server service
  hosts: dns_servers
  become: true
  tasks:
    - name: Post-Check 1 - Verify dnsmasq / BIND Service Status
      ansible.builtin.service_facts:

    - name: Assert DNS Service is Active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['bind9.service'].state == 'running'
        fail_msg: BIND is not running on the DNS server.

- name: Post-check DNS resolution from clients
  hosts: dns_clients
  become: true
  tasks:
    - name: Resolve an internal record using the DNS server
      ansible.builtin.command: "getent ahostsv4 dns-01.{{ bind_dns_zone }}"
      register: post_dns_internal
      changed_when: false
      failed_when: "dns_client_nameservers[0] not in post_dns_internal.stdout"

    - name: Validate outbound HTTPS connectivity
      ansible.builtin.uri:
        url: https://packages.microsoft.com
        method: HEAD
        status_code: [200, 301, 302]
      register: post_nat_https
