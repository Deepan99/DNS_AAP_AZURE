---
# Azure dynamic inventory. The AAP Azure Resource Manager credential supplies
# authentication; no cloud credentials are stored in Git.
plugin: azure.azcollection.azure_rm
include_vm_resource_groups:
  - RG-HUB-EASTUS
  - RG-SPOKE-EASTUS

auth_source: auto

groups:
  dns_servers: "tags.Role | default('') == 'dns_server'"
  dns_clients: "tags.Role | default('') == 'dns_client'"

keyed_groups:
  - key: tags.Role
    prefix: role
  - key: resource_group
    prefix: rg

# SSH via public IP when available, otherwise fall back to private IP.
# The bastion/dns-server has a public IP; spoke clients do not.
hostvar_expressions:
  ansible_host: public_ip_address | default(private_ip_address, true)

# Spoke VMs (no public IP) connect through the bastion as a jump host.
# Set the bastion's public IP as the SSH proxy in AAP job template
# extra_vars or in group_vars for dns_clients.
