---
name: Ansible quality gates

"on":
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible tooling
        run: pip install ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p "$RUNNER_TEMP"
      - name: Lint playbooks and roles
        run: ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/ansible_collections" ansible-lint playbooks roles
      - name: Lint YAML
        run: yamllint .

  trigger-aap:
    name: Launch AAP workflow
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Launch AAP workflow template
        run: |
          # AAP auto-syncs the project on launch (Update Revision on Launch)
          # Try gateway API first (AAP 2.5+), fall back to legacy API
          for API_PATH in "api/controller/v2" "api/v2"; do
            URL="${{ secrets.AAP_HOST }}/${API_PATH}/workflow_job_templates/${{ secrets.AAP_WORKFLOW_ID }}/launch/"
            echo "Trying: ${URL}"
            LAUNCH_RESULT=$(curl -sk -w "\n%{http_code}" -X POST \
              "${URL}" \
              -H "Authorization: Bearer ${{ secrets.AAP_TOKEN }}" \
              -H "Content-Type: application/json")
            HTTP_CODE=$(echo "$LAUNCH_RESULT" | tail -1)
            BODY=$(echo "$LAUNCH_RESULT" | head -n -1)
            echo "Response: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ AAP workflow launched successfully!"
              echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f'  Job ID: {data.get(\"id\", \"N/A\")}')
          print(f'  URL: {data.get(\"url\", \"N/A\")}')
          " || true
              exit 0
            fi
          done
          echo "::error::Failed to launch AAP workflow on all API paths"
          echo "$BODY"
          exit 1
