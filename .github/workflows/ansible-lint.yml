name: Ansible quality gates

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible_collections
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible tooling
        run: pip install ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p "$RUNNER_TEMP"
      - name: Lint playbooks and roles
        run: ansible-lint playbooks roles
      - name: Lint YAML
        run: yamllint .
